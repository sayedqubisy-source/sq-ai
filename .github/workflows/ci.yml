name: SQ AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Syntax check server/runtime files
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find . -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) ! -path './node_modules/*'); do
            node --check "$file"
          done
